name: macOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Build and test
    runs-on: macos-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4
      - name: Запустить XCTest
        run: swift test
      - name: Проверить локальные ссылки документации
        run: python3 script/check_links.py
      - name: Проверить release-сборку
        run: swift build -c release
      - name: Проверить отсутствие секретов в исходниках
        run: |
          ! rg -n --glob '!\.build/**' --glob '!dist/**' 'sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----' .
